name: Docker Image CI

on:
  push:
    branches: [ "ml" ]
  pull_request:
    branches: [ "ml" ]

jobs:

  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)




    name: Download a Build Artifact
  uses: actions/download-artifact@v7.0.0
  with:
    # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
    name: # optional
    # IDs of the artifacts to download, comma-separated. Either inputs `artifact-ids` or `name` can be used, but not both.
    artifact-ids: # optional
    # Destination path. Supports basic tilde expansion. Defaults to $GITHUB_WORKSPACE
    path: # optional
    # A glob pattern matching the artifacts that should be downloaded. Ignored if name is specified.
    pattern: # optional
    # When multiple artifacts are matched, this changes the behavior of the destination directories. If true, the downloaded artifacts will be in the same directory specified by path. If false, the downloaded artifacts will be extracted into individual named directories within the specified path.
    merge-multiple: # optional, default is false
    # The GitHub token used to authenticate with the GitHub API. This is required when downloading artifacts from a different repository or from a different workflow run. If this is not specified, the action will attempt to download artifacts from the current repository and the current workflow run.
    github-token: # optional
    # The repository owner and the repository name joined together by "/". If github-token is specified, this is the repository that artifacts will be downloaded from.
    repository: # optional, default is ${{ github.repository }}
    # The id of the workflow run where the desired download artifact was uploaded from. If github-token is specified, this is the run that artifacts will be downloaded from.
    run-id: # optional, default is ${{ github.run_id }}


    name: vercel-ai
  # You may pin to the exact commit or the version.
  # uses: vercel/ai-action@769eb5db2c70d4edda6b14d2f4bc3f4ac66fa55d
   uses: vercel/ai-action@v2.0.1
   with:
    # The input prompt to generate the text from
    prompt: 
    # An API KEY for the AI Gateway: https://vercel.com/d?to=%2F%5Bteam%5D%2F%7E%2Fai%2Fapi-keys
    api-key: 
    # An identifier from the list of provider models supported by the AI Gateway: https://vercel.com/ai-gateway/models
    model: 


            - name: AI Assessment Comment Labeler
  uses: github/ai-assessment-comment-labeler@v1.0.1
  with:
    # The token to use
    token: 
    # The label applied to the issue to trigger AI review
    ai_review_label: 
    # The issue number to comment on
    issue_number: 
    # The body of the issue to comment on
    issue_body: 
    # The path to the prompts directory where the .prompt.yml files are located
    prompts_directory: 
    # A mapping of labels to prompt files, separated by '|'. Format: 'label1,prompt1.prompt.yml|label2,prompt2.prompt.yml'
    labels_to_prompts_mapping: 
    # The model to use for AI generation. Will be inferred from the .prompt.yml file if not provided. Action will fail if not found in the file and not provided.
    model: # optional
    # The endpoint to use. Defaults to the OpenAI API endpoint "https://models.github.ai/inference"
    endpoint: # optional, default is https://models.github.ai/inference
    # The maximum number of tokens to generate. Will be inferred from the .prompt.yml file if not provided. Defaults to 200 if not found in the file.
    max_tokens: # optional
    # The name of the repository. Will be inferred from the GitHub context if not provided.
    repo_name: # optional
    # The owner of the repository. Will be inferred from the GitHub context if not provided.
    owner: # optional
    # Regex pattern for capturing the assessment line in the AI response used for creating the label to add to the issue. Default: "^###.*[aA]ssessment:\s*(.+)$"
    assessment_regex_pattern: # optional, default is ^###.*[aA]ssessment:\s*(.+)$
    # Regex flags for the assessment regex pattern. e.g.: "i" for case-insensitive matching.
    assessment_regex_flags: # optional, default is 
    # Regex pattern for capturing the no comment directive in the AI response. e.g.: "<!--.*no.*comment.*-->"
    no_comment_regex_pattern: # optional, default is 
    # Regex flags for the no comment regex pattern. e.g.: "i" for case-insensitive matching.
    no_comment_regex_flags: # optional, default is 
    # Do not add any labels to the issue. Useful if you just want to get the AI assessments and labels as outputs.
    suppress_labels: # optional, default is false
    # Do not add any comments to the issue. Useful if you just want to get the AI assessments and labels as outputs.
    suppress_comments: # optional, default is false
          

    
          
